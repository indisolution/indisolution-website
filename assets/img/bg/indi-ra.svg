<g transform="translate(236 92)"><rect x="0" y="0" width="560" height="560" rx="12" fill="#fff" stroke="#dde5f0"/><rect x="0" y="0" width="560" height="64" rx="12" fill="#075e54"/><rect x="0" y="40" width="560" height="24" rx="0" fill="#075e54"/><circle cx="38" cy="32" r="18" fill="#cde8e2"/><text x="70" y="38" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="start">INDI-RA · Your Store</text><rect x="20" y="92" width="284.2" height="44" rx="10" fill="#f1f4f8"/><text x="35" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Is the sage tee available in M?</text><rect x="190.20000000000005" y="162" width="349.79999999999995" height="44" rx="10" fill="#dcf8c6"/><text x="205.20000000000005" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Yes! Size M is in stock. Want the link?</text><rect x="20" y="232" width="267.79999999999995" height="44" rx="10" fill="#f1f4f8"/><text x="35" y="260" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Yes please. Delivery to Pune?</text><rect x="157.40000000000003" y="302" width="382.59999999999997" height="44" rx="10" fill="#dcf8c6"/><text x="172.40000000000003" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Usually 3–5 days to Pune. Here's your link:</text><rect x="20" y="372" width="300.59999999999997" height="44" rx="10" fill="#f1f4f8"/><text x="35" y="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Can I exchange if it doesn't fit?</text><rect x="198.40000000000003" y="442" width="341.59999999999997" height="44" rx="10" fill="#dcf8c6"/><text x="213.40000000000003" y="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#0f1b2d" text-anchor="start">Sure — I'll connect you with our team.</text><rect x="590" y="0" width="240" height="250" rx="12" fill="#fff" stroke="#dde5f0"/><text x="610" y="40" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="650" fill="#0f1b2d" text-anchor="start">Handed to team</text><circle cx="625" cy="80" r="14" fill="#eaf1fb"/><rect x="650" y="72" width="140" height="10" rx="5.0" fill="#dde5f0"/><rect x="650" y="90" width="90" height="10" rx="5.0" fill="#f4f7fb"/><circle cx="625" cy="136" r="14" fill="#eaf1fb"/><rect x="650" y="128" width="140" height="10" rx="5.0" fill="#dde5f0"/><rect x="650" y="146" width="90" height="10" rx="5.0" fill="#f4f7fb"/><circle cx="625" cy="192" r="14" fill="#eaf1fb"/><rect x="650" y="184" width="140" height="10" rx="5.0" fill="#dde5f0"/><rect x="650" y="202" width="90" height="10" rx="5.0" fill="#f4f7fb"/></g>
